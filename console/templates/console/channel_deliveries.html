<section class="panel"><h2>Delivery history</h2><div class="table-wrap"><table><thead><tr><th>Time (UTC)</th><th>Channel</th><th>Monitor</th><th>Event</th><th>Delivery</th></tr></thead><tbody>{% for d in deliveries %}<tr><td>{{ d.at|date:"M d H:i:s" }}</td><td>{{ d.channel.name|default:"Environment webhook" }}</td><td>{{ d.monitor.name|default:"—" }}</td><td>{{ d.event }}</td><td>{{ d.disposition }}</td></tr>{% empty %}<tr><td colspan="5">No deliveries yet.</td></tr>{% endfor %}</tbody></table></div></section>
