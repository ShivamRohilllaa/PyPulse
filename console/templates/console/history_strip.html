<div class="history-strip" role="list" aria-label="{{ description }}">{% for bucket in cells %}<span role="listitem" class="history-cell {{ bucket.state }}" title="{{ bucket.at|date:'M d H:i' }} UTC · {% if bucket.count %}{{ bucket.percent|floatformat:2 }}% passed · {{ bucket.count }} checks{% else %}No checks{% endif %}" aria-label="{{ bucket.at|date:'M d H:i' }} UTC: {% if bucket.count %}{{ bucket.percent|floatformat:2 }} percent{% else %}No checks{% endif %}"></span>{% endfor %}</div>
