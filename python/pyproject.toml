[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "pypulse-agent"
version = "0.1.0"
description = "Route-level metrics for FastAPI, Django REST framework and Flask"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
dependencies = []

[project.optional-dependencies]
test = ["pytest>=8,<10", "fastapi>=0.112,<1", "httpx>=0.27,<1", "flask>=3,<4", "Django>=5.2,<6", "djangorestframework>=3.15,<4", "uvicorn>=0.30,<1"]

[tool.setuptools]
packages = ["pypulse_agent"]
