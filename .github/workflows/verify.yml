name: Verify PyPulse
on: [push, pull_request]
permissions:
  contents: read
jobs:
  python:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.11','3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -r requirements.txt './python[test]'
      - run: python manage.py makemigrations --check --dry-run
      - run: python manage.py check
      - run: python manage.py test console
      - run: python -m pytest -q python/tests
  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose up -d --build
      - name: Verify dashboard, worker, and TLS configuration
        run: |
          curl -fsS --retry 15 --retry-delay 2 --retry-all-errors --max-time 4 http://127.0.0.1:8080/healthz
          curl -fsS http://127.0.0.1:8080/static/console/theme.js >/dev/null
          docker compose exec -T worker python manage.py check
          PYPULSE_DOMAIN=dashboard.example.org docker compose -f compose.yaml -f compose.https.yaml config --quiet
          docker run --rm -e PYPULSE_DOMAIN=dashboard.example.org -v "$PWD/deploy/Caddyfile:/etc/caddy/Caddyfile:ro" caddy:2-alpine caddy validate --config /etc/caddy/Caddyfile
      - name: Start the standalone image with a fresh database
        run: |
          image=$(docker compose images -q web | head -1)
          docker run -d --name standalone -p 127.0.0.1:8082:8080 "$image"
          curl -fsS --retry 15 --retry-delay 2 --retry-all-errors --max-time 4 http://127.0.0.1:8082/healthz
          curl -fsS http://127.0.0.1:8082/static/console/live.js >/dev/null
          docker exec standalone python manage.py migrate --check
          docker top standalone | grep '[p]ulseworker'
      - if: failure()
        run: docker compose logs --no-color --tail 80
      - if: always()
        run: |
          docker rm -f standalone || true
          docker compose down -v
